<!--
  The Marketplace tile. Geometry is the SAME cookie the activity bar paints
  (media/cukii-activity.svg): identical silhouette path, identical bite cut-outs
  and identical chip positions. The activity icon is monochrome because VS Code
  paints it as a CSS mask; here the same shape carries the brand palette.

  Do not re-derive this from media/cukii-mark.svg — that is the older, heavier
  outlined cookie, and shipping it made the store tile disagree with the sidebar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <mask id="bite-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white"/>
      <circle cx="49.5" cy="14" r="10" fill="black"/>
      <circle cx="38.5" cy="8.5" r="6" fill="black"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#F4EDE4"/>
  <path d="M56.3 31.7 C57.4 34.8 56.5 38 54.9 40.9 C53.6 43.3 51.3 45.4 49.4 47.7 C47.2 50.2 45.8 52.4 42.7 53.7 C39.9 55 37.1 56.1 34 56 C31.1 56.6 28.3 56.2 25.3 55.5 C22.4 55 20.2 53.2 18.1 51.5 C15.9 49.7 13.7 48.4 12.3 45.8 C10.9 43.2 9.7 40.6 8.5 37.9 C7.3 35.3 6.6 32.7 7.3 29.9 C7.5 26 8 23.6 9.1 21.3 C11.8 15.7 16.5 12.3 22.4 10.4 C27.5 8.7 33.1 6.2 38.2 8.5 C42.5 10.4 46.9 10.3 49.6 14.2 C53.4 18.9 55.4 24.4 56.3 31.7 Z"
        fill="#E3A867" stroke="#C9873F" stroke-width="2.2" stroke-linejoin="round" mask="url(#bite-mask)"/>
  <circle cx="26.6" cy="28.8" r="3.75" fill="#5C3A28"/>
  <circle cx="39.9" cy="35" r="5.25" fill="#5C3A28"/>
  <circle cx="28.2" cy="40.6" r="4.1" fill="#5C3A28"/>
</svg>
