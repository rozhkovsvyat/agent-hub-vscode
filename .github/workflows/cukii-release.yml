name: cukii-release

# Tag-driven promotion, mirroring the vacation repo pipeline:
#   rc-X.Y.Z  -> pre-release VSIX, GitHub pre-release, Marketplace preview channel
#   vX.Y.Z    -> stable VSIX, GitHub release, Marketplace stable (manual gate)
on:
  push:
    tags:
      - "rc-*"
      - "v*"

jobs:
  checks:
    uses: ./.github/workflows/cukii-ci.yml

  build:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Tag must match manifest version
        shell: bash
        working-directory: extensions/vscode
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(node -p "require('./package.json').version")
          case "$TAG" in
            rc-*) EXPECT="rc-${VER}" ;;
            v*)   EXPECT="v${VER}" ;;
            *)    echo "unsupported tag: $TAG"; exit 1 ;;
          esac
          if [ "$TAG" != "$EXPECT" ]; then
            echo "tag $TAG does not match manifest version $EXPECT"; exit 1
          fi
          echo "tag $TAG matches manifest $VER"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Build packages
        shell: bash
        run: node ./scripts/build-packages.js

      - name: Install build dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm --prefix extensions/vscode ci
          npm --prefix gui ci
          npm --prefix core ci

      - name: Build all target carriers
        shell: bash
        working-directory: extensions/vscode
        run: |
          if [ "${{ startsWith(github.ref_name, 'rc-') }}" = "true" ]; then
            npm run package-all -- --pre-release
          else
            npm run package-all
          fi

      - name: Verify every target carrier
        shell: pwsh
        run: |
          $version = (Get-Content extensions/vscode/package.json | ConvertFrom-Json).version
          $targets = @('win32-x64', 'darwin-arm64', 'darwin-x64', 'linux-x64', 'linux-arm64')
          foreach ($target in $targets) {
            $vsix = "extensions/vscode/build/cukii-vscode-$target-$version.vsix"
            pwsh -NoProfile -File scripts/assert-cukii-cross-target-vsix.ps1 `
              -VsixPath $vsix -ExpectedTarget $target -ExpectedVersion $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: all-targets-vsix
          path: extensions/vscode/build/cukii-vscode-*-*.vsix
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: all-targets-vsix
          path: vsix

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ startsWith(github.ref_name, 'rc-') }}
          files: vsix/*.vsix

  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # `marketplace` is an environment with required reviewers: a stable tag
    # waits for a human approval, exactly like the portal's prod gate.
    environment: ${{ startsWith(github.ref_name, 'rc-') && 'marketplace-preview' || 'marketplace' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Download VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: all-targets-vsix
          path: vsix

      - name: Publish to VS Code Marketplace
        working-directory: extensions/vscode
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARGS=(scripts/publish-marketplace.js --vsix-dir ../../vsix --version "$VERSION")
          if [ "$PRE" = "true" ]; then ARGS+=(--pre-release); fi
          node "${ARGS[@]}"
        env:
          PRE: ${{ startsWith(github.ref_name, 'rc-') }}
