name: 🐛 Bug report
description: Something in Cukii Chat is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The fastest route is **Report a bug** inside the chat: it attaches sanitised diagnostics automatically. Use this form if you cannot.
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Cukii Chat version
      placeholder: "2.0.161"
    validations:
      required: true
  - type: input
    attributes:
      label: Vendor and model
      placeholder: "Claude Code · Opus 5.5"
  - type: input
    attributes:
      label: OS and VS Code version
      placeholder: "macOS 26, VS Code 1.139"
