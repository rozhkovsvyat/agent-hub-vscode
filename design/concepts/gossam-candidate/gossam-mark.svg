  <path d="M51 19C42 23 36 29 32 37" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 47C20 40 26 37 32 37" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <circle cx="12" cy="18" r="4" fill="currentColor"/>
  <circle cx="51" cy="19" r="4" fill="currentColor"/>
  <circle cx="14" cy="47" r="4" fill="currentColor"/>
  <circle cx="32" cy="37" r="5" fill="currentColor"/>
</svg>
